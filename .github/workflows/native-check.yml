name: Native screening checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'qml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-check.yml'
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtqml-models cmake ninja-build ffmpeg espeak-ng
      - name: Prepare speech fixture
        run: espeak-ng -s 130 -w /tmp/suijian-asr-test.wav "This is a clear voice recording. We are testing local speech recognition and subtitle generation."
      - name: Build native application and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build -j 2
      - name: Run screening regressions
        run: SUIJIAN_ASR_TEST_AUDIO=/tmp/suijian-asr-test.wav ctest --test-dir build --output-on-failure
