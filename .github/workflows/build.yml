name: Multi-Platform Cloud Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SuiJian-macOS.dmg
            build_type: macos
          - os: windows-latest
            artifact_name: SuiJian-Windows.zip
            build_type: windows
          - os: ubuntu-latest
            artifact_name: SuiJian-Linux.tar.gz
            build_type: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Setup FFmpeg (Linux & Windows)
        if: matrix.build_type != 'macos'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup FFmpeg (macOS)
        if: matrix.build_type == 'macos'
        run: |
          which ffmpeg || brew install ffmpeg

      - name: Package macOS App & DMG (Slimmed & Stripped)
        if: matrix.build_type == 'macos'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" \
            --icon "assets/icon.icns" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSerialBus \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtPrintSupport \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtUiTools \
            --exclude-module PySide6.QtSpatialAudio \
            --exclude-module PySide6.QtVirtualKeyboard \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtGraphs \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --strip \
            main.py
          find dist/随剪.app -type f \( -name "*.dylib" -o -name "*.so" \) -exec strip -S {} + 2>/dev/null || true
          strip -S dist/随剪.app/Contents/MacOS/随剪 2>/dev/null || true
          hdiutil create -volname "随剪" -srcfolder dist/随剪.app -ov -format UDZO SuiJian-macOS.dmg

      - name: Package Windows EXE (Slimmed)
        if: matrix.build_type == 'windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" `
            --icon "assets/icon.ico" `
            --add-data "qml;qml" `
            --add-data "backend;backend" `
            --add-data "assets;assets" `
            --exclude-module PySide6.QtWebEngine `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.Qt3DInput `
            --exclude-module PySide6.Qt3DLogic `
            --exclude-module PySide6.Qt3DAnimation `
            --exclude-module PySide6.Qt3DExtras `
            --exclude-module PySide6.QtSql `
            --exclude-module PySide6.QtTest `
            --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtPositioning `
            --exclude-module PySide6.QtLocation `
            --exclude-module PySide6.QtSensors `
            --exclude-module PySide6.QtSerialPort `
            --exclude-module PySide6.QtSerialBus `
            --exclude-module PySide6.QtBluetooth `
            --exclude-module PySide6.QtNfc `
            --exclude-module PySide6.QtWebSockets `
            --exclude-module PySide6.QtWebChannel `
            --exclude-module PySide6.QtRemoteObjects `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtPdfWidgets `
            --exclude-module PySide6.QtPrintSupport `
            --exclude-module PySide6.QtHelp `
            --exclude-module PySide6.QtUiTools `
            --exclude-module PySide6.QtSpatialAudio `
            --exclude-module PySide6.QtVirtualKeyboard `
            --exclude-module PySide6.QtTextToSpeech `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtGraphs `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            main.py
          Compress-Archive -Path dist/随剪/* -DestinationPath SuiJian-Windows.zip

      - name: Package Linux Binary (Slimmed & Stripped)
        if: matrix.build_type == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" \
            --icon "assets/icon.png" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSerialBus \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtPrintSupport \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtUiTools \
            --exclude-module PySide6.QtSpatialAudio \
            --exclude-module PySide6.QtVirtualKeyboard \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtGraphs \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --strip \
            main.py
          find dist/随剪 -type f -name "*.so*" -exec strip --strip-unneeded {} + 2>/dev/null || true
          strip --strip-unneeded dist/随剪/随剪 2>/dev/null || true
          tar -czvf SuiJian-Linux.tar.gz -C dist/随剪 .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  build-native-linux:
    name: Native C++ Build (Ultra-Slim Linux ~30MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 Development Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-multimedia-dev cmake ninja-build libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_NO_PACKAGE_VERSION_CHECK=TRUE

      - name: Build Native Binary
        run: |
          cmake --build build --config Release
          strip --strip-unneeded build/DJIEditor 2>/dev/null || true
          mkdir -p dist-native
          cp build/DJIEditor dist-native/随剪
          tar -czvf SuiJian-Native-Linux-x64.tar.gz -C dist-native .

      - name: Upload Native Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuiJian-Native-Linux-x64.tar.gz
          path: SuiJian-Native-Linux-x64.tar.gz

  build-native-macos:
    name: Native C++ Build (Ultra-Slim macOS ~35MB)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 and Build Tools
        run: |
          brew install qt ninja cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Native macOS App & DMG
        run: |
          cmake --build build --config Release
          find build -name "*.dylib" -exec strip -S {} + 2>/dev/null || true
          mkdir -p dist-native
          cp -R build/随剪.app dist-native/ 2>/dev/null || cp -R build/DJIEditor.app dist-native/随剪.app 2>/dev/null || true
          hdiutil create -volname "随剪-原生版" -srcfolder dist-native/随剪.app -ov -format UDZO SuiJian-Native-macOS.dmg

      - name: Upload Native macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SuiJian-Native-macOS.dmg
          path: SuiJian-Native-macOS.dmg

  release:
    name: Publish Release Packages
    needs: [build, build-native-linux, build-native-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: 随剪 SuiJian ${{ github.ref_name }} 测试版
          prerelease: true
          generate_release_notes: true
