name: Multi-Platform Cloud Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SuiJian-macOS.dmg
            build_type: macos
          - os: windows-latest
            artifact_name: SuiJian-Windows.zip
            build_type: windows
          - os: ubuntu-latest
            artifact_name: SuiJian-Linux.tar.gz
            build_type: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Setup FFmpeg (Linux & Windows)
        if: matrix.build_type != 'macos'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup FFmpeg (macOS)
        if: matrix.build_type == 'macos'
        run: |
          which ffmpeg || brew install ffmpeg

      - name: Package macOS App & DMG
        if: matrix.build_type == 'macos'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" \
            --icon "assets/icon.icns" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            main.py
          hdiutil create -volname "随剪" -srcfolder dist/随剪.app -ov -format UDZO SuiJian-macOS.dmg

      - name: Package Windows EXE
        if: matrix.build_type == 'windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" `
            --icon "assets/icon.ico" `
            --add-data "qml;qml" `
            --add-data "backend;backend" `
            --add-data "assets;assets" `
            main.py
          Compress-Archive -Path dist/随剪/* -DestinationPath SuiJian-Windows.zip

      - name: Package Linux Binary
        if: matrix.build_type == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "随剪" \
            --icon "assets/icon.png" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            main.py
          tar -czvf SuiJian-Linux.tar.gz -C dist/随剪 .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
