name: Multi-Platform Cloud Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-native-windows:
    name: Native C++ Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
      - name: Build and deploy
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          New-Item -ItemType Directory -Force dist-native | Out-Null
          Copy-Item build/Release/DJIEditor.exe dist-native/随剪.exe
          windeployqt --release --qmldir qml dist-native/随剪.exe
          Compress-Archive -Path dist-native/* -DestinationPath SuiJian-Native-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuiJian-Native-Windows.zip
          path: SuiJian-Native-Windows.zip

  build-native-linux:
    name: Native C++ Build (Ultra-Slim Linux ~30MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 Development Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-multimedia-dev cmake ninja-build libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_NO_PACKAGE_VERSION_CHECK=TRUE

      - name: Build Native Binary
        run: |
          cmake --build build --config Release
          strip --strip-unneeded build/DJIEditor 2>/dev/null || true
          mkdir -p dist-native
          cp build/DJIEditor dist-native/随剪
          tar -czvf SuiJian-Native-Linux-x64.tar.gz -C dist-native .

      - name: Upload Native Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuiJian-Native-Linux-x64.tar.gz
          path: SuiJian-Native-Linux-x64.tar.gz

  build-native-macos:
    name: Native C++ Build (Ultra-Slim macOS ~35MB)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 and Build Tools
        run: |
          brew install qt ninja cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Native macOS App & DMG
        run: |
          cmake --build build --config Release
          "$(brew --prefix qt)/bin/macdeployqt" build/随剪.app -qmldir=qml
          find build -name "*.dylib" -exec strip -S {} + 2>/dev/null || true
          mkdir -p dist-native
          cp -R build/随剪.app dist-native/ 2>/dev/null || cp -R build/DJIEditor.app dist-native/随剪.app 2>/dev/null || true
          hdiutil create -volname "随剪-原生版" -srcfolder dist-native/随剪.app -ov -format UDZO SuiJian-Native-macOS.dmg

      - name: Upload Native macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SuiJian-Native-macOS.dmg
          path: SuiJian-Native-macOS.dmg

  release:
    name: Publish Release Packages
    needs: [build-native-windows, build-native-linux, build-native-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: 随剪 SuiJian ${{ github.ref_name }} 测试版
          prerelease: true
          generate_release_notes: true
