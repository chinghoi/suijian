name: Multi-Platform Cloud Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: DJI-Editor-macOS.dmg
            build_type: macos
          - os: windows-latest
            artifact_name: DJI-Editor-Windows.zip
            build_type: windows
          - os: ubuntu-latest
            artifact_name: DJI-Editor-Linux.AppImage
            build_type: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6-essentials pyside6-addons pyinstaller

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Package macOS App & DMG
        if: matrix.build_type == 'macos'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "DJI智能剪辑大师" \
            --icon "assets/icon.icns" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            main.py
          hdiutil create -volname "DJI智能剪辑大师" -srcfolder dist/DJI智能剪辑大师.app -ov -format UDZO DJI-Editor-macOS.dmg

      - name: Package Windows EXE
        if: matrix.build_type == 'windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "DJIEditor" `
            --icon "assets/icon.ico" `
            --add-data "qml;qml" `
            --add-data "backend;backend" `
            --add-data "assets;assets" `
            main.py
          Compress-Archive -Path dist/DJIEditor/* -DestinationPath DJI-Editor-Windows.zip

      - name: Package Linux Binary
        if: matrix.build_type == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "DJIEditor" \
            --icon "assets/icon.png" \
            --add-data "qml:qml" \
            --add-data "backend:backend" \
            --add-data "assets:assets" \
            main.py
          tar -czvf DJI-Editor-Linux.tar.gz -C dist/DJIEditor .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            DJI-Editor-macOS.dmg
            DJI-Editor-Windows.zip
            DJI-Editor-Linux.tar.gz
